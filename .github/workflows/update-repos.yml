name: App-Daten aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'   # täglich 04:17 UTC
  workflow_dispatch:        # manuell über den Actions-Tab
  push:
    paths: ['apps.json']    # neue App eingetragen

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Änderungen committen
        run: |
          if git diff --quiet data/repos.json; then echo "Keine Änderungen"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "App-Daten aktualisiert"
          git push
